<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment & Vehicle Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--y:#FBCE07;--r:#DD1D21;--ink:#404040;--grey:#8a8a8a;--line:#e3e3e3;--bg:#f7f7f7;--ok:#2e7d32;--warn:#e08a00}
*{box-sizing:border-box}
html{font-size:clamp(14px,1.1vw + 10px,18px)}
body{margin:0;font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{width:min(100%,1600px);margin:0 auto;padding:0 clamp(10px,2vw,32px)}
header{background:#fff;border-bottom:3px solid var(--y)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:14px}
h1{margin:0;font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--grey);font-size:clamp(1rem,2.2vw,1.5rem)}
.sub{font-size:.75rem;color:var(--grey);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ver{font-size:.7rem;color:var(--grey);letter-spacing:.1em}
.lang button{border:1px solid var(--line);background:#fff;padding:3px 9px;font:inherit;font-size:.75rem;cursor:pointer;color:var(--ink)}
.lang button.on{background:var(--y);border-color:var(--y);font-weight:500}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;font:inherit;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;padding:10px 14px;cursor:pointer;color:var(--grey);border-bottom:3px solid transparent;margin-bottom:-3px}
nav button.on{color:var(--ink);border-bottom-color:var(--r)}
main{padding:18px 0 60px}
.card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--y);padding:10px 14px}
.kpi b{display:block;font-size:1.6rem;font-weight:400}.kpi span{font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:.08em}
.kpi.r{border-left-color:var(--r)}.kpi.w{border-left-color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
.bar input,.bar select{width:auto;flex:1 1 150px}
label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
h3{font-weight:400;text-transform:uppercase;letter-spacing:.15em;font-size:.85rem;color:var(--grey);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
button.btn{background:var(--y);border:0;padding:9px 18px;font:inherit;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;font-weight:500;cursor:pointer;color:#222}
button.btn.sec{background:#fff;border:1px solid var(--ink)}button.btn.red{background:var(--r);color:#fff}
button.btn.sm{padding:4px 10px;font-size:.7rem}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:#fffbe6}
.pill{display:inline-block;padding:2px 9px;font-size:.72rem;letter-spacing:.05em;border-radius:20px;color:#fff;background:var(--grey)}
.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--r)}.pill.pend{background:#6b7b8c}
.msg{padding:10px 14px;margin-bottom:12px;border-left:4px solid var(--y);background:#fffbe6;font-size:.9rem}
.msg.err{border-color:var(--r);background:#fdecec}
dialog{border:0;padding:0;width:min(98vw,980px);max-height:94vh;box-shadow:0 10px 40px #0004}
dialog::backdrop{background:#0006}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#fff;border-bottom:3px solid var(--y)}
.db{padding:16px 18px;overflow:auto;max-height:80vh}
.x{border:0;background:none;font-size:1.4rem;cursor:pointer}
.login{max-width:420px;margin:8vh auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.hide{display:none!important}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px}
.chk label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink);margin:0}
.chk input{width:auto}
.upr td{background:#fffbe6;white-space:normal}
.banner{padding:28px 18px;text-align:center;color:#fff;margin-bottom:14px}
.banner b{display:block;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:500;letter-spacing:.12em}
.vbox{max-width:640px;margin:0 auto}
.hint{font-size:.78rem;color:var(--grey);text-transform:none;letter-spacing:0}
@media print{header nav,.bar,.row,.lang{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="brand"><span id="lockup"></span><div><h1 data-t="title"></h1><div class="sub" data-t="subtitle"></div></div></div>
    <div class="tr">
      <div class="ver" id="ver"></div>
      <div class="lang"><button data-l="en">EN</button><button data-l="id">ID</button><button data-l="ms">MS</button></div>
      <div class="ver" id="who"></div>
    </div>
  </div>
  <nav id="nav" class="hide"></nav>
</div></header>
<main class="wrap" id="app"></main>
<dialog id="dlg"><div class="dh"><b id="dt" style="font-weight:500;letter-spacing:.1em;text-transform:uppercase"></b><button class="x" onclick="dlg.close()">&times;</button></div><div class="db" id="db"></div></dialog>

async function readFile(f){
  const b64=x=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(x);});
  if(f.type==='application/pdf'){if(f.size>3.5*1048576)throw new Error(t('toobig'));return{mime:f.type,b64:await b64(f)};}
  if(!/^image\/(jpeg|png)$/.test(f.type))throw new Error(t('badtype'));
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f);});
  const sc=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return{mime:'image/jpeg',b64:c.toDataURL('image/jpeg',.8).split(',')[1]};}
async function doUpload(k){try{const f=$('#upfile').files[0];if(!f)throw new Error(t('file'));const o=collect($('#upf')),fl=await readFile(f);
  await api('uploadDoc',{itemId:cur,docType:k,number:o.number||'',expiry:o.expiry||'',note:o.note||'',fileName:f.name,mime:fl.mime,b64:fl.b64});upk='';await refresh(t('uploaded'));}catch(e){drawItem(e.message,1);}}
async function viewDoc(id){const w=window.open('','_blank');try{const r=await api('getFile',{docId:id});const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let n=0;n<bin.length;n++)u[n]=bin.charCodeAt(n);w.location=URL.createObjectURL(new Blob([u],{type:r.mime}));}catch(e){if(w)w.close();drawItem(e.message,1);}}
async function vdoc(id,res){let note2='';if(res==='No'){note2=prompt(t('rejreason'))||'';if(!note2)return;}try{await api('verifyDoc',{docId:id,result:res,note:note2});await refresh();}catch(e){drawItem(e.message,1);}}
function checklist(){const o={};document.querySelectorAll('[data-c]').forEach(x=>o[x.dataset.c]=x.checked);return o;}
async function approveItem(){try{const r=await api('approve',{itemId:cur,checklist:checklist(),notes:($('#inotes').value||'').trim()});await refresh(r.created?`${t('stk')}: ${r.stickerNo}`:t('saved'));}catch(e){drawItem(e.message,1);}}
async function rejectItem(){const n=prompt(t('rejreason'));if(!n)return;try{await api('reject',{itemId:cur,note:n});await refresh(t('saved'));}catch(e){drawItem(e.message,1);}}
async function voidItem(){const n=prompt(t('voidreason'));if(!n)return;try{await api('voidItem',{itemId:cur,reason:n});await refresh(t('saved'));}catch(e){drawItem(e.message,1);}}
async function allowReprint(){const n=prompt(t('reprintreason'));if(!n)return;try{await api('allowReprint',{itemId:cur,reason:n});await refresh(t('saved'));}catch(e){drawItem(e.message,1);}}

// ---------- sticker (QR opens the live verification page) ----------
function qrSvg(url){const q=qrcode(0,'M');q.addData(url);q.make();return q.createSvgTag(4,0).replace(/ width="[^"]*"/,'').replace(/ height="[^"]*"/,'');}
function stickerDoc(s,i,preview){
  const url=location.href.split('#')[0].split('?')[0]+'?v='+encodeURIComponent(i.ID)+'&t='+encodeURIComponent(s.Token);
  const V=i.Category==='Vehicle';
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(s.StickerNo)}</title><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>@page{size:90mm 128mm;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Jost,Arial,sans-serif;color:#222}
.s{width:90mm;height:128mm;border:.7mm solid #222;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{background:#FBCE07;padding:2.5mm 4mm;display:flex;align-items:center;justify-content:space-between;border-bottom:.7mm solid #222}
.top small{font-size:6pt;letter-spacing:.12em;text-transform:uppercase;text-align:right;line-height:1.3}
.pass{padding:2.5mm 4mm 1mm;text-align:center}.pass b{display:block;font-size:15pt;letter-spacing:.14em;color:#2e7d32;font-weight:600}
.pass .en{font-size:7.6pt;font-weight:500;line-height:1.25;text-transform:uppercase;letter-spacing:.03em}.pass .id{font-size:6.6pt;font-style:italic;color:#555;margin-top:.5mm}
.plate{margin:1.5mm 4mm;border:.5mm solid #222;text-align:center;padding:1mm;font-size:17pt;font-weight:600;letter-spacing:.1em}
.meta{display:flex;gap:3mm;padding:0 4mm;align-items:center}.meta .q{width:30mm;height:30mm;flex:none}.meta .q svg{width:100%;height:100%}
.meta .t{font-size:7pt;line-height:1.45}.meta .t b{font-weight:500;color:#777;text-transform:uppercase;letter-spacing:.06em;font-size:6pt;display:block;margin-top:1mm}
.scan{font-size:5.8pt;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:.8mm 4mm 0;color:#555}
.disc{margin:auto 4mm 1.5mm;padding-top:1.2mm;border-top:.3mm solid #999;font-size:5.4pt;line-height:1.28;color:#333}.disc p{margin:0 0 .8mm}
.foot{background:#222;color:#fff;font-size:5.8pt;letter-spacing:.1em;text-align:center;padding:1.1mm;text-transform:uppercase}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22pt;font-weight:600;color:rgba(221,29,33,.35);transform:rotate(-28deg);text-align:center;pointer-events:none}
</style></head><body><div class="s">
<div class="top">${lockup(86,40)}<small>${V?'Vehicle':'Equipment'}<br>Inspection</small></div>
<div class="pass"><b>&#10003; PASSED</b><div class="en">${V?'Vehicle':'Equipment'} has passed EcoOils Initial Inspection and Document Verification</div><div class="id">${V?'Kendaraan':'Peralatan'} lulus Inspeksi Awal dan Verifikasi Dokumen EcoOils</div></div>
<div class="plate">${esc(i.PlateSerial)}</div>
<div class="meta"><div class="q">${qrSvg(url)}</div><div class="t"><b>Type / Jenis</b>${esc(i.Type)}<b>Company / Perusahaan</b>${esc(i.Company)}<b>Issued / Terbit</b>${esc(s.IssuedAt)}<b>Sticker / Stiker</b>${esc(s.StickerNo)}</div></div>
<div class="scan">Scan to verify live status / Pindai untuk verifikasi status terkini</div>
<div class="disc"><p><b>DISCLAIMER.</b> This sticker confirms that the ${V?'vehicle':'equipment'} passed EcoOils Initial Inspection and document verification on the date of issue only. If any damage or defect is identified during normal inspection, this inspection is VOID and the ${V?'vehicle':'equipment'} must be re-inspected before further use on site. Validity is confirmed only by scanning the QR code. Single issue, non-transferable.</p>
<p><b>PERNYATAAN.</b> Stiker ini menyatakan ${V?'kendaraan':'peralatan'} lulus Inspeksi Awal dan verifikasi dokumen EcoOils pada tanggal terbit. Jika ditemukan kerusakan atau cacat saat inspeksi normal, inspeksi ini BATAL dan ${V?'kendaraan':'peralatan'} wajib diinspeksi ulang sebelum digunakan di lokasi. Keabsahan hanya dipastikan dengan memindai kode QR. Satu kali terbit, tidak dapat dipindahtangankan.</p></div>
<div class="foot">Single print &middot; S/N ${esc(s.StickerNo)}</div>
${preview?'<div class="wm">PREVIEW<br>NOT VALID</div>':''}</div></body></html>`;}
function stickerPreview(){const i=items.find(x=>x.ID===cur),s=stickerOf(cur);const w=window.open('','_blank');w.document.open();w.document.write(stickerDoc(s,i,true));w.document.close();}
async function stickerPrint(){if(!confirm(t('printconfirm')))return;const w=window.open('','_blank');
  try{const r=await api('printSticker',{itemId:cur});w.document.open();w.document.write(stickerDoc(r.sticker,r.item,false));w.document.close();setTimeout(()=>w.print(),900);await refresh();}catch(e){if(w)w.close();drawItem(e.message,1);}}

// ---------- public verification page (QR target) ----------
async function renderVerify(){
  $('#app').innerHTML='<div class="vbox"></div>';const box=$('#app .vbox');
  try{const v=(await api('verify',{id:VERIFY.id,t:VERIFY.t})).v;
    const col={FIT:'#2e7d32',SUSPENDED:'#e08a00',VOID:'#DD1D21','NOT APPROVED':'#6b7b8c'}[v.Fit]||'#6b7b8c',txt={FIT:t('vfit'),SUSPENDED:t('vsusp'),VOID:t('vvoid'),'NOT APPROVED':t('vna')}[v.Fit];
    box.innerHTML=`<div class="banner" style="background:${col}"><b>${txt}</b></div>
    <div class="card"><table><tbody><tr><td>${t('plate')}</td><td><b>${esc(v.PlateSerial)}</b></td></tr><tr><td>${t('type')}</td><td>${esc(v.Type)}${v.MakeModel?' | '+esc(v.MakeModel):''}</td></tr><tr><td>${t('company')}</td><td>${esc(v.Company)}</td></tr><tr><td>${t('id')}</td><td>${esc(v.ID)}</td></tr><tr><td>${t('stickerno')}</td><td>${esc(v.StickerNo)}</td></tr><tr><td>${t('issued')}</td><td>${esc(v.IssuedAt)}</td></tr><tr><td>${t('nextinsp')}</td><td>${esc(v.NextInspection)}</td></tr></tbody></table>
    ${v.Why&&v.Why.length&&v.Fit!=='FIT'?`<div class="msg err" style="margin-top:12px"><b>${t('reason')}:</b><br>${v.Why.map(esc).join('<br>')}</div>`:''}</div>
    <div class="card"><h3 style="margin-top:0">${t('docs')}</h3><table><tbody>${v.Docs.map(d=>`<tr><td>${t('d_'+d.k)}</td><td>${rpill(d.s)}</td></tr>`).join('')}</tbody></table></div>`;
  }catch(e){box.innerHTML=`<div class="banner" style="background:#DD1D21"><b>${esc(e.message)}</b></div>`;}}

(async function init(){applyLang();if(VERIFY)return render();if(token)await load();else render();})();
</script>
</body>
</html>
