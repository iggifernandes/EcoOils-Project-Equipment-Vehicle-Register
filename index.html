<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heavy Equipment & Vehicle Register</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
.rvo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:12px}.rvb{background:#fff;width:min(1100px,100%);height:min(88vh,860px);display:flex;flex-direction:column;border-top:4px solid #FBCE07}.rvh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.rvm{flex:1;display:flex;min-height:0}.rvl{width:260px;overflow:auto;border-right:1px solid var(--line)}.rvl div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}.rvl div.on{background:#fff6cc}.rvl small{display:block;color:#666}.rvv{flex:1;display:flex;flex-direction:column;min-width:0}.rvv .vw{flex:1;min-height:0;overflow:auto;background:#eee;display:flex;align-items:center;justify-content:center}.rvv iframe{width:100%;height:100%;border:0}.rvv img{max-width:100%;max-height:100%}.rvf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:700px){.rvm{flex-direction:column}.rvl{width:auto;max-height:28%;border-right:0;border-bottom:1px solid var(--line)}}
</style>
<style>
:root{--y:#FBCE07;--r:#DD1D21;--ink:#404040;--grey:#8a8a8a;--line:#e3e3e3;--bg:#f7f7f7;--ok:#2e7d32;--warn:#e08a00}
*{box-sizing:border-box}
html{font-size:clamp(14px,1.1vw + 10px,18px)}
body{margin:0;font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{width:min(100%,1600px);margin:0 auto;padding:0 clamp(10px,2vw,32px)}
header{background:#fff;border-bottom:3px solid var(--y)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:14px}
h1{margin:0;font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--grey);font-size:clamp(1rem,2.2vw,1.5rem)}
.sub{font-size:.75rem;color:var(--grey);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ver{font-size:.7rem;color:var(--grey);letter-spacing:.1em}
.lang button{border:1px solid var(--line);background:#fff;padding:3px 9px;font:inherit;font-size:.75rem;cursor:pointer;color:var(--ink)}
.lang button.on{background:var(--y);border-color:var(--y);font-weight:500}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;font:inherit;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;padding:10px 14px;cursor:pointer;color:var(--grey);border-bottom:3px solid transparent;margin-bottom:-3px}
nav button.on{color:var(--ink);border-bottom-color:var(--r)}
main{padding:18px 0 60px}
.card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--y);padding:10px 14px}
.kpi b{display:block;font-size:1.6rem;font-weight:400}.kpi span{font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:.08em}
.kpi.r{border-left-color:var(--r)}.kpi.w{border-left-color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
.bar input,.bar select{width:auto;flex:1 1 150px}
label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
h3{font-weight:400;text-transform:uppercase;letter-spacing:.15em;font-size:.85rem;color:var(--grey);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
button.btn{background:var(--y);border:0;padding:9px 18px;font:inherit;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;font-weight:500;cursor:pointer;color:#222}
button.btn.sec{background:#fff;border:1px solid var(--ink)}button.btn.red{background:var(--r);color:#fff}
button.btn.sm{padding:4px 10px;font-size:.7rem}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.fold{margin:0 0 12px;border:1px solid var(--line);background:#fff}.fold>summary{cursor:pointer;padding:10px 12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}.fold>summary .hint{margin-left:10px;text-transform:none;letter-spacing:0}.fold h4{margin:10px 12px 6px;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#666}.fold .tw{border:0;border-top:1px solid var(--line)}
.vbox .card{overflow-x:auto}.vbox td{vertical-align:top}.les{line-height:1.6;padding-left:20px;font-size:15px}.les li{margin:6px 0}.qb{margin:14px 0}.op{display:flex;gap:8px;align-items:flex-start;margin:6px 0;text-transform:none;letter-spacing:0;font-size:14px;cursor:pointer}.op input{width:auto;margin-top:3px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:#fffbe6}
.pill{display:inline-block;padding:2px 9px;font-size:.72rem;letter-spacing:.05em;border-radius:20px;color:#fff;background:var(--grey)}
.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--r)}.pill.pend{background:#6b7b8c}
.msg{padding:10px 14px;margin-bottom:12px;border-left:4px solid var(--y);background:#fffbe6;font-size:.9rem}
.msg.err{border-color:var(--r);background:#fdecec}
dialog{border:0;padding:0;width:min(98vw,980px);max-height:94vh;box-shadow:0 10px 40px #0004}
dialog::backdrop{background:#0006}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#fff;border-bottom:3px solid var(--y)}
.db{padding:16px 18px;overflow:auto;max-height:80vh}
.x{border:0;background:none;font-size:1.4rem;cursor:pointer}
.login{max-width:420px;margin:8vh auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.hide{display:none!important}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px}
.chk label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink);margin:0}
.chk input{width:auto}
.upbar{display:flex;gap:8px;align-items:flex-end;flex-wrap:nowrap;background:#fffbe6;border:1px solid var(--line);padding:10px;margin-bottom:8px}.upbar>div{flex:1 1 0;min-width:0}.upbar>div.w2{flex:2 1 0}.upbar input[type=file]{font-size:.75rem;padding:5px}.upbar input:disabled{background:#f0f0f0}.upbar button{flex:none}@media(max-width:760px){.upbar{flex-wrap:wrap}.upbar>div,.upbar>div.w2{flex:1 1 45%}}
.banner{padding:28px 18px;text-align:center;color:#fff;margin-bottom:14px}
.banner b{display:block;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:500;letter-spacing:.12em}
.vbox{max-width:640px;margin:0 auto}
.hint{font-size:.78rem;color:var(--grey);text-transform:none;letter-spacing:0}
@media print{header nav,.bar,.row,.lang{display:none}}
</style>
</head>

<header><div class="wrap">
  <div class="top">
    <div class="brand"><span id="lockup"></span><div><h1 data-t="title"></h1><div class="sub" data-t="subtitle"></div></div></div>
    <div class="tr">
      <div class="ver" id="ver"></div>
      <div class="lang"><button data-l="en">EN</button><button data-l="id">ID</button><button data-l="ms">MS</button></div>
      <div class="ver" id="who"></div>
    </div>
  </div>
  <nav id="nav" class="hide"></nav>
</div></header>
<main class="wrap" id="app"></main>

async function api(action,p={}){
  if(!API_URL)throw new Error(t('noapi'));
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,token},p))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Error');return j;
}
function lockup(w){ // EcoOils wordmark with PROJECT (logo yellow) stretched below it to the same width
  const ih=w*LOGO_H/LOGO_W,fs=Math.round(w*0.17),h=Math.round(ih+fs+6);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><image href="${LOGO_URL}" x="0" y="0" width="${w}" height="${ih}"/><text x="0" y="${Math.round(ih+fs+1)}" font-family="Jost,Arial,sans-serif" font-size="${fs}" font-weight="500" fill="#FDC402" textLength="${w}" lengthAdjust="spacing">PROJECT</text></svg>`;}
const msg=(m,e)=>m?`<div class="msg ${e?'err':''}">${esc(m)}</div>`:'';

// ---------- helpers ----------
function daysLeft(s){if(!s)return null;return Math.round((new Date(s+'T00:00:00')-new Date(new Date().toDateString()))/864e5);}
function dpill(s){const d=daysLeft(s);if(d===null)return '<span class="pill">-</span>';
  if(d<0)return `<span class="pill bad">${esc(s)}</span>`;if(d<=30)return `<span class="pill warn">${d} ${t('days')}</span>`;return `<span class="pill ok">${esc(s)}</span>`;}
function sl(i){return i.Fit==='NOT APPROVED'?i.Status:i.Fit;}
function spill(i){const s=sl(i);const c=s==='FIT'?'ok':s==='SUSPENDED'?'warn':(s==='VOID'||s==='Rejected')?'bad':'pend';return `<span class="pill ${c}">${esc(t(s))}</span>`;}
function rpill(s,o){if(o&&s==='missing')return `<span class="pill pend">${t('optional')}</span>`;const c=s==='ok'?'ok':(s==='missing'||s==='rejected'||s==='expired')?'bad':'warn';return `<span class="pill ${c}">${t(s)}</span>`;}
const stickerOf=id=>stickers.find(s=>s.ItemID===id&&s.Status==='Active');
const pendingDocs=i=>i.Rules.filter(r=>r.s==='unverified'||r.pendingId).length;

function render(){applyLang();const nav=$('#nav');

  const tabs=[['register','register'],['add','add']];if(isHSSE())tabs.push(['approvals','approvals']);tabs.push(['alerts','alerts']);if(canWork())tabs.push(['train','train']);tabs.push(['warn','warn']);tabs.push(['forms','forms']);if(isHSSE())tabs.push(['contacts','contacts']);
  nav.innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${t(l)}</button>`).join('')+`<button style="margin-left:auto" onclick="signout()">${t('signout')}</button>`;

function savedEmails(){try{return JSON.parse(localStorage.getItem('evr_emails')||'[]').filter(x=>typeof x==='string')}catch(_){return[]}}
function rememberEmail(e){try{e=String(e||'').trim().toLowerCase();if(!e)return;const l=[e].concat(savedEmails().filter(x=>x!==e)).slice(0,8);localStorage.setItem('evr_emails',JSON.stringify(l));}catch(_){}}
function renderAuth(){const f=authMode,sv=savedEmails(),em=($('#a_e')&&$('#a_e').value)||sv[0]||'';
  $('#app').innerHTML=`<div class="card login"><form id="authf" method="post" action="#" autocomplete="on" onsubmit="authSubmit(event)">${note?msg(note.replace(/^!/,''),note.startsWith('!')):''}

  ${f==='reset'?`<div class="row"><button class="btn" type="submit">${t('sendcode')}</button><button class="btn sec" type="button" onclick="authMode='login';note='';render()">${t('back')}</button></div>`:''}
  ${f==='setpin'?`<div style="height:10px"></div><label>${t('code')}</label><input id="a_c" name="otp" inputmode="numeric" autocomplete="one-time-code"><div style="height:10px"></div><label>${t('newpin')}</label><input id="a_p" name="new-password" type="password" inputmode="numeric" autocomplete="new-password"><div class="row"><button class="btn" type="submit">${t('savepin')}</button><button class="btn sec" type="button" onclick="authMode='login';note='';render()">${t('back')}</button></div>`:''}</form></div>`;}
function authSubmit(e){e.preventDefault();({login:doLogin,reset:doReset,setpin:doSetPin})[authMode]();}
async function doLogin(){try{const keep=$('#a_k').checked;const r=await api('login',{email:$('#a_e').value,pin:$('#a_p').value,keep});token=r.token;user=r.user;rememberEmail($('#a_e').value);try{localStorage.removeItem('evr_tok');sessionStorage.removeItem('evr_tok');sessionStorage.removeItem('evr_tok');(keep?localStorage:sessionStorage).setItem('evr_tok',token);localStorage.setItem('evr_keep',keep?'1':'0');}catch(_){}await load();}catch(e){errNote(e);render();}}
async function doReset(){try{const em=$('#a_e').value;await api('requestReset',{email:em});authMode='setpin';note=t('codesent');render();$('#a_e').value=em;}catch(e){errNote(e);render();}}

async function signout(){try{if(token)await api('logout');}catch(e){}token='';user=null;localStorage.removeItem('evr_tok');sessionStorage.removeItem('evr_tok');render();}
async function load(){try{const r=await api('list');
  if(!Array.isArray(r.items)||!Array.isArray(r.docs)||!Array.isArray(r.stickers)||r.items.some(i=>!Array.isArray(i.Rules))){user=r.user||user;items=[];docs=[];stickers=[];note='!The backend (Code.gs) is older than this page. In Apps Script paste the latest Code.gs, run setup(), then Deploy > Manage deployments > Edit > New version > Deploy.';render();return;}
  user=r.user;items=r.items;docs=r.docs;stickers=r.stickers;}catch(e){token='';user=null;localStorage.removeItem('evr_tok');sessionStorage.removeItem('evr_tok');errNote(e);}render();}

let flt={q:'',cat:'',st:'',co:''};
function viewRegister(){
  const kp=[[t('total'),items.length,''],[t('fit'),items.filter(i=>i.Fit==='FIT').length,''],[t('pending'),items.filter(i=>i.Status==='Submitted'||pendingDocs(i)).length,'w'],[t('expiring'),docs.filter(d=>{const n=daysLeft(d.Expiry);return d.Verified==='Yes'&&n!==null&&n>=0&&n<=30;}).length,'w'],[t('expired'),items.filter(i=>i.Fit==='SUSPENDED'||i.Fit==='VOID').length,'r']];
  const rows=items.filter(i=>(!flt.cat||i.Category===flt.cat)&&(!flt.st||sl(i)===flt.st)&&(!flt.co||i.Company===flt.co)&&(!flt.q||JSON.stringify(i).toLowerCase().includes(flt.q.toLowerCase())));

  <select onchange="flt.cat=this.value;viewRegister()"><option value="">${t('category')}: ${t('all')}</option><option value="Vehicle" ${flt.cat==='Vehicle'?'selected':''}>${t('vehicle')}</option><option value="Heavy Equipment" ${flt.cat==='Heavy Equipment'?'selected':''}>${t('heavy')}</option></select>

const rowFn=i=>{const rq=i.Rules.filter(r=>!r.opt),ok=rq.filter(r=>r.s==='ok').length;const s=stickerOf(i.ID);return `<tr class="click" onclick="openItem('${esc(i.ID)}')"><td>${esc(i.ID)}</td><td>${esc(i.Type)}</td><td>${esc(i.PlateSerial)}</td><td>${esc(i.OperatorName)}</td><td>${ok}/${rq.length}</td><td>${i.Status==='Approved'?dpill(i.NextInspection):'-'}</td><td>${esc(t(i.LocationStatus)||i.LocationStatus)}</td><td>${spill(i)}</td><td>${s?esc(s.StickerNo):''}</td></tr>`;};
function tbl(list){return `<div class="tw"><table><thead><tr><th>${t('id')}</th><th>${t('type')}</th><th>${t('plate')}</th><th>${t('operator')}</th><th>${t('docs')}</th><th>${t('nextinsp')}</th><th>${t('location')}</th><th>${t('status')}</th><th>${t('sticker')}</th></tr></thead><tbody>${list.map(rowFn).join('')||`<tr><td colspan="9">${t('none')}</td></tr>`}</tbody></table></div>`;}

    return `<details class="fold" ${open}><summary>&#128193; ${esc(c)} <span class="hint">${mine.length} | ${LV}: ${lv.length} | ${HV}: ${hv.length}</span></summary>
    <h4>${LV} (${lv.length})</h4>${tbl(lv)}<h4>${HV} (${hv.length})</h4>${tbl(hv)}</details>`;}).join('');}

  $('#app').innerHTML=`<div class="tw"><table><thead><tr><th>${t('id')}</th><th>${t('type')}</th><th>${t('plate')}</th><th>${t('company')}</th><th>${t('docs')}</th><th>${t('status')}</th></tr></thead><tbody>${p.map(i=>`<tr class="click" onclick="openItem('${esc(i.ID)}')"><td>${esc(i.ID)}</td><td>${esc(i.Type)}</td><td>${esc(i.PlateSerial)}</td><td>${esc(i.Company)}</td><td>${pendingDocs(i)} ${t('pending')}</td><td>${spill(i)}</td></tr>`).join('')||`<tr><td>${t('none')}</td></tr>`}</tbody></table></div>`;}

function fld(k,l,v,type,opts){v=v||'';
  if(opts)return `<div><label>${t(l)}</label><select data-f="${k}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  if(type==='ta')return `<div style="grid-column:1/-1"><label>${t(l)}</label><textarea data-f="${k}" rows="2">${esc(v)}</textarea></div>`;
  return `<div><label>${t(l)}</label><input data-f="${k}" type="${type||'text'}" value="${esc(v)}"></div>`;}
function identHtml(i){i=i||{};const V=(i.Category||'Vehicle')==='Vehicle';
  const types=(V?VTYPES:HTYPES).map(x=>[x,x]);if(i.Type&&!types.some(x=>x[0]===i.Type))types.push([i.Type,i.Type]);
  return `<div class="grid"><div><label>${t('category')}</label><select data-f="Category" onchange="recat(this)"><option value="Vehicle" ${V?'selected':''}>${t('vehicle')}</option><option value="Heavy Equipment" ${V?'':'selected'}>${t('heavy')}</option></select></div>
  ${fld('Type','type',i.Type||types[0][0],'',types)}${fld('MakeModel','make',i.MakeModel)}${fld('PlateSerial','plate',i.PlateSerial)}
  ${user.role==='IC'?'':fld('Company','company',i.Company||COS[0],'',COS.map(c=>[c,c]))}
  ${!i.ID?fld('LocationStatus','location',i.LocationStatus||'Off-site','',LOCS.map(c=>[c,t(c)])):''}
  ${fld('OperatorName','operator',i.OperatorName)}${V?fld('OperatorLicenceClass','simcls',i.OperatorLicenceClass||'B1','',SIMCLS.map(c=>[c,c])):fld('OperatorLicenceClass','siocls',i.OperatorLicenceClass)}
  ${fld('Remarks','remarks',i.Remarks,'ta')}</div>`;}
function recat(sel){const root=sel.closest('[data-root]');const o=collect(root);o.Type='';root.innerHTML=identHtml(o);}

function drawItem(m,e){const i=items.find(x=>x.ID===cur);if(!i)return;$('#dt').textContent=i.ID+' | '+i.PlateSerial;
  const editable=canWork()&&(isHSSE()||['Draft','Rejected','Void'].includes(i.Status));
  $('#db').innerHTML=(m?msg(m,e):'')+`<div class="row" style="margin-top:0">${spill(i)}${i.Status==='Approved'?`<span class="hint">${t('nextinsp')}: ${esc(i.NextInspection)}</span>`:''}</div>
  ${canWork()?`<div class="row" style="align-items:center"><label style="margin:0">${t('location')}</label><select id="locsel" onchange="setLoc(this.value)">${LOCS.map(c=>`<option value="${c}" ${i.LocationStatus===c?'selected':''}>${t(c)}</option>`).join('')}</select></div>`:''}
  ${i.FitWhy&&i.FitWhy.length&&i.Fit!=='FIT'?`<div class="msg err">${i.FitWhy.map(esc).join('<br>')}</div>`:''}${i.DecisionNote&&['Rejected','Void'].includes(i.Status)?`<div class="msg err">${esc(i.DecisionNote)}</div>`:''}
  <h3>${t('identity')}</h3><div data-root id="df">${identHtml(i)}</div>${editable?`<div class="row"><button class="btn sec" onclick="saveItem()">${t('save')}</button></div>`:''}
  <h3>${t('docs')} ${canWork()&&rvList(i).length?`<button class="btn sm" style="margin-left:8px" onclick="reviewDocs()">${t('reviewall')}</button>`:''}</h3>${uploadBar(i)}<div class="hint" style="margin-bottom:6px">${t('docnote')}</div><div class="tw"><table><thead><tr><th>${t('docs')}</th><th>${t('status')}</th><th>${t('number')}</th><th>${t('expiry')}</th><th></th></tr></thead><tbody>${i.Rules.filter(r=>!r.opt).map(r=>docRow(i,r)).join('')}${i.Rules.some(r=>r.opt)?`<tr><th colspan="5" style="background:#f3f3f3">${t('optdocs')}</th></tr><tr><td colspan="5"><div class="hint" style="color:#8a1c1c;white-space:normal;width:min(620px,78vw)">${t('optdisc')}</div></td></tr>${i.Rules.filter(r=>r.opt).map(r=>docRow(i,r)).join('')}`:''}</tbody></table></div>
  <div class="row"><button class="btn sec" onclick="printChk()">${t('chkbtn')}</button></div>
  ${canWork()&&['Draft','Rejected','Void'].includes(i.Status)?`<div class="row"><button class="btn" onclick="submitItem()">${t('submit')}</button></div>`:''}
  ${isHSSE()&&['Submitted','Approved'].includes(i.Status)?inspHtml(i):''}${isHSSE()&&i.Status==='Approved'?stickerHtmlPanel(i):''}
  ${isHSSE()?`<h3>${t('delh')}</h3><div id="delbox"><div class="row" style="margin-top:0"><button class="btn red" onclick="showDel()">${t('delb')}</button></div></div>`:''}`;
  if(!editable)$('#df').querySelectorAll('#df input,#df select,#df textarea').forEach(x=>x.disabled=true);if($('#upk'))syncUp();}
async function setLoc(v){try{await api('setLocation',{itemId:cur,location:v});const i=items.find(x=>x.ID===cur);if(i)i.LocationStatus=v;await load();drawItem(t('saved'));}catch(e){drawItem(e.message,1);}}
function showDel(){$('#delbox').innerHTML=`<div class="hint" style="margin-bottom:8px">${t('delwarn')}</div><div class="grid"><div><label>${t('delreason')}</label><input id="delr"></div><div><label>${t('pin')}</label><input id="delp" type="password" inputmode="numeric" autocomplete="current-password"></div></div><div class="row"><button class="btn red" onclick="doDel()">${t('delc')}</button><button class="btn sec" onclick="drawItem()">${t('cancel')}</button></div>`;$('#delp').focus();}

  const row=(a,b)=>`<td class="l">${a}</td><td>${esc(b||'')}</td>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Pre-Mobilisation HSSE Inspection ${esc(i.ID)}</title><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

thead{display:table-header-group}tr{break-inside:avoid;page-break-inside:avoid}

// ---------- driver training: lessons + quiz (EN / ID / MS). Answer key lives in Code.gs (QUIZ_KEY). ----------
const LES={
en:[
{h:"1. Defensive driving",b:["Expect other road users to make mistakes. Drive so that you can stop in time.","Keep at least 3 seconds from the vehicle ahead. Double it in rain, dust or on loose ground.","Look 12 to 15 seconds ahead and keep your eyes moving: mirrors, junctions, pedestrians, machines.","Obey the site speed limit. Go slower at junctions, blind corners, in rain, dust and near people.","Always leave yourself an escape route. Do not drive into a gap you cannot get out of.","Headlights on. Make sure others can see you. Use the horn and indicators early.","Tired? Stop in a safe place and rest. Fatigue kills. Never drive after a bad night.","Do the pre-use check every day. Report any defect and do not drive an unsafe vehicle."]},
{h:"2. NO FLAGMAN = NO MOVEMENT",b:["On this site a vehicle or machine does NOT move when a flagman (banksman) is required and not in place.","A flagman is required: when reversing, with restricted view, near people, in lifting and loading areas, in narrow or congested work zones.","The flagman wears hi-vis, is trained, and stands where the driver can always see them.","Agree the signals first. Stop is an arm raised or a hand up. If you lose sight of the flagman: STOP.","Drivers and operators never move first and look later. No flagman, no movement. No exceptions, no shortcuts.","Everyone has stop-work authority. Anyone can stop a movement that looks unsafe."]},
{h:"3. Life-Saving Rules: Driving safety",b:["Wear your seatbelt. Every person, every trip.","Do not use your phone while driving. Stop in a safe place first.","Do not exceed the speed limit.","Follow the journey management plan: agreed route, stops and arrival report.","No alcohol and no drugs while working or driving. Zero.","These rules are not optional. Breaking them leads to the warning system (lesson 6)."]},
{h:"4. Life-Saving Rules: Line of fire",b:["Line of fire is the path where a moving, falling or released object or energy can strike you.","Before you stand or park, ask: if something moves, falls or releases, could it hit me?","Never stand between a moving vehicle and a fixed object, or behind a reversing vehicle.","Keep clear of tyres under pressure, hoses, cables and loads under tension.","Watch for pinch points, rolling loads and swinging booms.","Use barriers, exclusion zones and a flagman. Move yourself out of the line of fire."]},
{h:"5. Life-Saving Rules: Suspended load",b:["Do not walk or stand under a suspended load. Ever.","Stay out of the swing and fall zone. The zone is barricaded: do not cross.","Wait until the load is landed and the signal is given before you approach.","Drivers: stay in a safe place, never under the boom or load, and never ride on a load.","Only the trained rigger or flagman gives signals to the crane operator.","If a load starts to swing or slip, move away immediately, clear of the line of fire."]},
{h:"6. Warning system (SP1 / SP2 / SP3)",b:["Breaking these rules is recorded as a violation by HSSE.","SP1 (first warning): written warning and mandatory re-training.","SP2 (second warning within 12 months): driving suspended and re-training.","SP3 (third warning within 12 months): removed from site, pending HSSE Manager decision.","Serious breaches, such as moving without a flagman or driving under the influence, may start at a higher level.","You sign a declaration that you have completed this training and understand these rules."]}],
id:[
{h:"1. Mengemudi defensif",b:["Anggap pengguna jalan lain bisa melakukan kesalahan. Kemudi agar Anda selalu bisa berhenti tepat waktu.","Jaga jarak minimal 3 detik dari kendaraan di depan. Gandakan saat hujan, berdebu atau tanah lepas.","Pandang 12 sampai 15 detik ke depan dan terus gerakkan mata: spion, persimpangan, pejalan kaki, alat berat.","Patuhi batas kecepatan site. Lebih pelan di persimpangan, tikungan buta, saat hujan, berdebu dan dekat orang.","Selalu sisakan jalur keluar. Jangan masuk ke celah yang tidak bisa Anda tinggalkan.","Nyalakan lampu utama. Pastikan orang lain melihat Anda. Gunakan klakson dan sein lebih awal.","Lelah? Berhenti di tempat aman dan istirahat. Kelelahan membunuh. Jangan mengemudi setelah kurang tidur.","Lakukan pemeriksaan pra-pakai setiap hari. Laporkan kerusakan dan jangan pakai kendaraan yang tidak aman."]},
{h:"2. TANPA FLAGMAN = TIDAK BERGERAK",b:["Di site ini kendaraan atau alat TIDAK boleh bergerak jika flagman (juru isyarat) diperlukan tetapi tidak ada.","Flagman wajib: saat mundur, pandangan terbatas, dekat orang, di area pengangkatan dan bongkar muat, di area kerja sempit atau padat.","Flagman memakai rompi reflektif, terlatih, dan berdiri di tempat yang selalu terlihat oleh pengemudi.","Sepakati isyarat lebih dulu. Berhenti: lengan atau tangan diangkat. Jika kehilangan pandangan ke flagman: BERHENTI.","Pengemudi dan operator tidak boleh bergerak dulu baru melihat. Tanpa flagman, tidak bergerak. Tanpa pengecualian.","Semua orang punya wewenang menghentikan pekerjaan. Siapa pun boleh menghentikan gerakan yang tampak tidak aman."]},
{h:"3. Life-Saving Rules: Keselamatan berkendara",b:["Pakai sabuk pengaman. Semua orang, setiap perjalanan.","Jangan gunakan telepon saat mengemudi. Berhenti di tempat aman dulu.","Jangan melebihi batas kecepatan.","Ikuti rencana manajemen perjalanan: rute yang disepakati, perhentian dan laporan kedatangan.","Tanpa alkohol dan tanpa narkoba saat bekerja atau mengemudi. Nol.","Aturan ini bukan pilihan. Pelanggaran masuk ke sistem peringatan (pelajaran 6)."]},
{h:"4. Life-Saving Rules: Garis tembak (line of fire)",b:["Garis tembak adalah jalur di mana benda atau energi yang bergerak, jatuh atau terlepas bisa mengenai Anda.","Sebelum berdiri atau parkir, tanyakan: jika sesuatu bergerak, jatuh atau terlepas, apakah bisa mengenai saya?","Jangan berdiri di antara kendaraan yang bergerak dan benda tetap, atau di belakang kendaraan yang mundur.","Jauhi ban bertekanan, selang, kabel dan beban yang tegang.","Waspadai titik jepit, beban menggelinding dan boom yang berayun.","Gunakan barikade, zona eksklusi dan flagman. Keluarkan diri Anda dari garis tembak."]},
{h:"5. Life-Saving Rules: Beban menggantung",b:["Jangan berjalan atau berdiri di bawah beban yang menggantung. Tidak pernah.","Jauhi zona ayunan dan jatuh. Zona diberi barikade: jangan dilewati.","Tunggu sampai beban diturunkan dan isyarat diberikan sebelum mendekat.","Pengemudi: tetap di tempat aman, tidak di bawah boom atau beban, dan jangan menumpang di beban.","Hanya rigger atau flagman terlatih yang memberi isyarat kepada operator crane.","Jika beban mulai berayun atau tergelincir, segera menjauh dari garis tembak."]},
{h:"6. Sistem peringatan (SP1 / SP2 / SP3)",b:["Pelanggaran aturan ini dicatat sebagai pelanggaran oleh HSSE.","SP1 (peringatan pertama): peringatan tertulis dan pelatihan ulang wajib.","SP2 (peringatan kedua dalam 12 bulan): dilarang mengemudi dan pelatihan ulang.","SP3 (peringatan ketiga dalam 12 bulan): dikeluarkan dari site, menunggu keputusan HSSE Manager.","Pelanggaran berat, seperti bergerak tanpa flagman atau mengemudi di bawah pengaruh, dapat dimulai dari tingkat lebih tinggi.","Anda menandatangani pernyataan bahwa telah menyelesaikan pelatihan ini dan memahami aturan-aturan ini."]}],
ms:[
{h:"1. Pemanduan defensif",b:["Jangkakan pengguna jalan lain boleh membuat kesilapan. Memandulah supaya anda sentiasa boleh berhenti tepat pada masanya.","Jaga jarak sekurang-kurangnya 3 saat dari kenderaan di hadapan. Gandakan ketika hujan, berdebu atau tanah longgar.","Pandang 12 hingga 15 saat ke hadapan dan sentiasa gerakkan mata: cermin, simpang, pejalan kaki, jentera.","Patuhi had laju tapak. Lebih perlahan di simpang, selekoh buta, ketika hujan, berdebu dan berhampiran orang.","Sentiasa tinggalkan laluan keluar. Jangan masuk ke ruang yang anda tidak dapat keluar.","Hidupkan lampu depan. Pastikan orang lain nampak anda. Gunakan hon dan isyarat awal.","Letih? Berhenti di tempat selamat dan berehat. Keletihan membunuh. Jangan memandu selepas kurang tidur.","Lakukan pemeriksaan pra-guna setiap hari. Laporkan kerosakan dan jangan guna kenderaan yang tidak selamat."]},
{h:"2. TIADA FLAGMAN = TIADA PERGERAKAN",b:["Di tapak ini kenderaan atau jentera TIDAK boleh bergerak jika flagman (pemberi isyarat) diperlukan tetapi tiada.","Flagman wajib: semasa berundur, pandangan terhad, berhampiran orang, di kawasan pengangkatan dan pemunggahan, di kawasan kerja sempit atau sesak.","Flagman memakai jaket reflektif, terlatih, dan berdiri di tempat yang sentiasa kelihatan oleh pemandu.","Persetujui isyarat dahulu. Berhenti: lengan atau tangan diangkat. Jika hilang pandangan kepada flagman: BERHENTI.","Pemandu dan pengendali tidak boleh bergerak dahulu kemudian melihat. Tiada flagman, tiada pergerakan. Tiada pengecualian.","Semua orang mempunyai kuasa menghentikan kerja. Sesiapa boleh menghentikan pergerakan yang nampak tidak selamat."]},
{h:"3. Life-Saving Rules: Keselamatan memandu",b:["Pakai tali pinggang keledar. Semua orang, setiap perjalanan.","Jangan guna telefon semasa memandu. Berhenti di tempat selamat dahulu.","Jangan melebihi had laju.","Ikut pelan pengurusan perjalanan: laluan dipersetujui, perhentian dan laporan ketibaan.","Tiada alkohol dan tiada dadah semasa bekerja atau memandu. Sifar.","Peraturan ini bukan pilihan. Pelanggaran masuk ke sistem amaran (pelajaran 6)."]},
{h:"4. Life-Saving Rules: Garis tembakan (line of fire)",b:["Garis tembakan ialah laluan di mana objek atau tenaga yang bergerak, jatuh atau terlepas boleh mengenai anda.","Sebelum berdiri atau meletak kenderaan, tanya: jika sesuatu bergerak, jatuh atau terlepas, boleh kena saya?","Jangan berdiri antara kenderaan yang bergerak dan objek tetap, atau di belakang kenderaan yang berundur.","Jauhi tayar bertekanan, hos, kabel dan beban yang tegang.","Awasi titik himpit, beban bergolek dan boom yang berayun.","Gunakan penghadang, zon pengecualian dan flagman. Alihkan diri anda dari garis tembakan."]},
{h:"5. Life-Saving Rules: Beban tergantung",b:["Jangan berjalan atau berdiri di bawah beban yang tergantung. Tidak sekali-kali.","Jauhi zon hayunan dan jatuh. Zon dipagar: jangan lintas.","Tunggu sehingga beban diturunkan dan isyarat diberi sebelum menghampiri.","Pemandu: kekal di tempat selamat, bukan di bawah boom atau beban, dan jangan menumpang pada beban.","Hanya rigger atau flagman terlatih memberi isyarat kepada pengendali kren.","Jika beban mula berayun atau tergelincir, segera menjauh dari garis tembakan."]},

const VIOL=['nofm','spd','phone','belt','susp','lof','alc','jmp','other'];

// ---------- training view ----------
const VL={en:{nofm:'Moved without a flagman',spd:'Speeding',phone:'Phone use while driving',belt:'No seatbelt',susp:'Under / in the zone of a suspended load',lof:'Line of fire breach',alc:'Alcohol or drugs',jmp:'No journey plan',other:'Other'},
id:{nofm:'Bergerak tanpa flagman',spd:'Melebihi kecepatan',phone:'Telepon saat mengemudi',belt:'Tanpa sabuk pengaman',susp:'Di bawah / zona beban menggantung',lof:'Pelanggaran garis tembak',alc:'Alkohol atau narkoba',jmp:'Tanpa rencana perjalanan',other:'Lainnya'},
ms:{nofm:'Bergerak tanpa flagman',spd:'Memandu laju',phone:'Guna telefon semasa memandu',belt:'Tiada tali pinggang keledar',susp:'Di bawah / zon beban tergantung',lof:'Pelanggaran garis tembakan',alc:'Alkohol atau dadah',jmp:'Tiada pelan perjalanan',other:'Lain-lain'}};
let tr={step:'start',name:'',did:'',plate:'',co:'',les:0,ans:[],score:0,total:10,passed:false,agreed:false},trainRows=[],warnData={warnings:[],drivers:[]};
function trReset(){tr={step:'start',name:'',did:'',plate:'',co:user&&user.role==='IC'?user.company:'',les:0,ans:[],score:0,total:10,passed:false,agreed:false};}
function trKeep(){const a=$('#tr_n');if(a)tr.name=a.value.trim();const b=$('#tr_i');if(b)tr.did=b.value.trim();const c=$('#tr_p');if(c)tr.plate=c.value.trim();const d=$('#tr_c');if(d)tr.co=d.value;}
function viewTrain(){const L=LES[lang]||LES.en,Q=QZ[lang]||QZ.en,s=tr.step;let h=msg(note.replace(/^!/,''),note.startsWith('!'));
  if(s==='start'){h+=`<div class="card"><h3 style="margin-top:0">${t('trh')}</h3><div class="hint">${t('trnote')}</div>
   <div class="grid" style="margin-top:10px"><div><label>${t('trname')}</label><input id="tr_n" value="${esc(tr.name)}"></div><div><label>${t('trid')}</label><input id="tr_i" value="${esc(tr.did)}"></div>
   <div><label>${t('plate')}</label><input id="tr_p" value="${esc(tr.plate)}"></div>${user.role==='IC'?'':`<div><label>${t('company')}</label><select id="tr_c">${COS.map(c=>`<option ${tr.co===c?'selected':''}>${c}</option>`).join('')}</select></div>`}</div>
   <div class="row"><button class="btn" onclick="trStart()">${t('trstart')}</button></div></div>`;}
  else if(s==='learn'){const l=L[tr.les];h+=`<div class="card"><div class="hint">${t('trlesson')} ${tr.les+1} / ${L.length} | ${esc(tr.name)}</div><h3 style="margin:6px 0 10px">${esc(l.h)}</h3><ul class="les">${l.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <div class="row">${tr.les>0?`<button class="btn sec" onclick="tr.les--;viewTrain()">${t('trback')}</button>`:''}<button class="btn" onclick="trNext()">${tr.les<L.length-1?t('trnext'):t('trquiz')}</button></div></div>`;}
  else if(s==='quiz'){h+=`<div class="card"><h3 style="margin-top:0">${t('trquizh')}</h3><div class="hint">${t('trpass')}</div>${Q.map((q,n)=>`<div class="qb"><b>${n+1}. ${esc(q.q)}</b>${q.o.map((o,k)=>`<label class="op"><input type="radio" name="q${n}" value="${k}" ${tr.ans[n]===k?'checked':''} onchange="tr.ans[${n}]=${k}"> ${esc(o)}</label>`).join('')}</div>`).join('')}
   <div class="row"><button class="btn" onclick="trGrade()">${t('trsubmit')}</button><button class="btn sec" onclick="tr.step='learn';tr.les=0;viewTrain()">${t('trreview')}</button></div></div>`;}
  else if(s==='fail'){h+=`<div class="card"><div class="msg err">${t('trfail')} ${tr.score}/${tr.total}</div><div class="row"><button class="btn" onclick="tr.step='learn';tr.les=0;tr.ans=[];viewTrain()">${t('trretry')}</button></div></div>`;}
  else if(s==='sign'){h+=`<div class="card"><div class="msg">${t('trpassed')} ${tr.score}/${tr.total}</div><h3>${t('trdecl')}</h3>
   <p style="line-height:1.55">${esc(t('trdecltxt'))}</p><label class="op"><input type="checkbox" id="tr_a" ${tr.agreed?'checked':''} onchange="tr.agreed=this.checked"> ${esc(tr.name)}: ${t('tragree')}</label>
   <label style="margin-top:10px">${t('trsign')}</label><canvas id="sig" width="480" height="150" style="border:1px solid var(--line);background:#fff;touch-action:none;max-width:100%"></canvas>
   <div class="row"><button class="btn" onclick="trSave()">${t('trsubmitsign')}</button><button class="btn sec" onclick="sigClear()">${t('trclear')}</button></div></div>`;}
  else if(s==='done'){h+=`<div class="card"><div class="msg">${t('trdone')}</div><div class="row"><button class="btn" onclick="printCert('${tr.last}')">${t('trcert')}</button><button class="btn sec" onclick="trReset();go('train')">${t('trnew')}</button></div></div>`;}
  if(s==='start'||s==='done'){h+=`<h3>${t('trrec')}</h3><div class="tw"><table><thead><tr><th>${t('trname')}</th><th>${t('trid')}</th><th>${t('company')}</th><th>${t('plate')}</th><th>${t('trscore')}</th><th>${t('date')}</th><th>${t('trvalid')}</th><th></th></tr></thead><tbody>${trainRows.map(r=>`<tr><td>${esc(r.DriverName)}</td><td>${esc(r.DriverID)}</td><td>${esc(r.Company)}</td><td>${esc(r.Plate)}</td><td>${r.Score}/${r.Total}</td><td>${esc((r.Time||'').slice(0,10))}</td><td>${dpill(r.ValidUntil)}</td><td><button class="btn sec sm" onclick="printCert('${esc(r.TrainID)}')">${t('trcert')}</button></td></tr>`).join('')||`<tr><td colspan="8">${t('none')}</td></tr>`}</tbody></table></div>`;}
  $('#app').innerHTML=h;if(s==='sign')sigInit();}
function trStart(){trKeep();if(!tr.name){note='!'+t('trname');render();return;}note='';tr.step='learn';tr.les=0;tr.ans=[];viewTrain();}
function trNext(){const n=(LES[lang]||LES.en).length;if(tr.les<n-1){tr.les++;}else{tr.step='quiz';}window.scrollTo(0,0);viewTrain();}
async function trGrade(){try{if(tr.ans.length<10||tr.ans.some(x=>x===undefined))throw new Error(t('trall'));const r=await api('gradeTraining',{answers:tr.ans});tr.score=r.score;tr.total=r.total;tr.step=r.passed?'sign':'fail';note='';window.scrollTo(0,0);viewTrain();}catch(e){errNote(e);viewTrain();}}
let sigDown=false,sigInk=false;
function sigInit(){const c=$('#sig'),x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#111';sigInk=false;
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
  c.onpointerdown=e=>{sigDown=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);};
  c.onpointermove=e=>{if(!sigDown)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();sigInk=true;};
  c.onpointerup=c.onpointercancel=()=>{sigDown=false;};}
function sigClear(){const c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);sigInk=false;}
async function trSave(){try{tr.agreed=$('#tr_a').checked;if(!tr.agreed)throw new Error(t('tragreeerr'));if(!sigInk)throw new Error(t('trsignerr'));
  const r=await api('saveTraining',{answers:tr.ans,driverName:tr.name,driverId:tr.did,plate:tr.plate,company:tr.co,agreed:true,lang,signature:$('#sig').toDataURL('image/png')});
  tr.last=r.trainId;tr.step='done';note='';trainRows=(await api('listTraining')).training;viewTrain();}catch(e){errNote(e);viewTrain();$('#app').scrollIntoView();}}
async function printCert(id){const w=window.open('','_blank');if(!w){note='!Allow pop-ups to print';render();return;}try{const r=(await api('getTraining',{trainId:id})).record;w.document.open();w.document.write(certDoc(r));w.document.close();setTimeout(()=>w.print(),900);}catch(e){w.close();note='!'+e.message;render();}}
function certDoc(r){return `<!doctype html><html><head><meta charset="utf-8"><title>Training completion ${esc(r.TrainID)}</title><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>@page{size:A4;margin:14mm}body{font-family:Jost,Arial,sans-serif;color:#222;font-size:11pt}h1{font-weight:300;letter-spacing:.14em;text-transform:uppercase;font-size:16pt;margin:0}.en{color:#666;font-size:9.5pt}
.h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #FBCE07;padding-bottom:8px;margin-bottom:14px}table{width:100%;border-collapse:collapse;margin:10px 0}td{border:1px solid #999;padding:6px 8px}td.l{background:#f3f3f3;width:30%;font-weight:500}
li{margin:3px 0}.sg{display:flex;gap:30px;margin-top:20px}.sg div{flex:1;border-top:1px solid #333;padding-top:4px;min-height:90px;font-size:9.5pt}.sg img{max-height:70px;display:block;margin-bottom:4px}</style></head><body>
<div class="h"><div>${lockup(120)}</div><div style="text-align:right"><h1>Pernyataan Penyelesaian Pelatihan</h1><div class="en">Driver Training Completion Declaration | Sei Mangkei</div></div></div>
<table><tr><td class="l">Nama / Name</td><td>${esc(r.DriverName)}</td></tr><tr><td class="l">No. ID / SIM / ID no.</td><td>${esc(r.DriverID)}</td></tr><tr><td class="l">Kontraktor / Contractor</td><td>${esc(r.Company)}</td></tr><tr><td class="l">Kendaraan / Vehicle</td><td>${esc(r.Plate)} ${esc(r.ItemID)}</td></tr>
<tr><td class="l">Nilai / Score</td><td>${r.Score} / ${r.Total} (lulus / passed)</td></tr><tr><td class="l">Tanggal / Date</td><td>${esc((r.Time||'').slice(0,10))}</td></tr><tr><td class="l">Berlaku s/d / Valid until</td><td>${esc(r.ValidUntil)}</td></tr></table>
<b>Materi / Content:</b><ul><li>Mengemudi defensif / Defensive driving</li><li>TANPA FLAGMAN = TIDAK BERGERAK / NO FLAGMAN = NO MOVEMENT</li><li>Life-Saving Rules: keselamatan berkendara, garis tembak, beban menggantung / driving safety, line of fire, suspended load</li><li>Sistem peringatan SP1 / SP2 / SP3 / Warning system</li></ul>
<p>Saya menyatakan telah menyelesaikan pelatihan ini, memahami aturan di atas, dan bersedia menerima sistem peringatan bila melanggar.<br><span class="en">I declare that I have completed this training, understand the rules above, and accept the warning system if I break them.</span></p>
<div class="sg"><div>${r.Signature?`<img src="${r.Signature}">`:''}Tanda tangan pengemudi / Driver signature<br>${esc(r.DriverName)}</div><div><br><br>Diverifikasi HSSE kontraktor / Contractor HSE<br>Nama / Name:</div><div><br><br>HSSE EcoOils<br>Nama / Name:</div></div>
<p class="en" style="margin-top:18px">Record ${esc(r.TrainID)} | recorded by ${esc(r.RecordedBy)}</p></body></html>`;}

// ---------- warnings view ----------
function lvl(n){return `<span class="pill ${n>=3?'bad':n===2?'warn':'pend'}">SP${n}</span>`;}
function viewWarn(){const V=VL[lang]||VL.en,hs=isHSSE();let h=msg(note.replace(/^!/,''),note.startsWith('!'));
  if(hs)h+=`<div class="card"><h3 style="margin-top:0">${t('wissue')}</h3><div class="hint">${t('wnote')}</div><div class="grid" id="wf" style="margin-top:10px">
   <div><label>${t('company')}</label><select data-f="company">${COS.map(c=>`<option>${c}</option>`).join('')}</select></div>
   <div><label>${t('trname')}</label><input data-f="driverName"></div><div><label>${t('trid')}</label><input data-f="driverId"></div><div><label>${t('plate')}</label><input data-f="plate"></div>
   <div><label>${t('wviol')}</label><select data-f="violation">${VIOL.map(v=>`<option value="${v}">${esc(V[v])}</option>`).join('')}</select></div>
   <div><label>${t('wlevel')}</label><select data-f="level"><option value="">${t('wauto')}</option><option value="1">SP1</option><option value="2">SP2</option><option value="3">SP3</option></select></div>

   <div class="row"><button class="btn red" onclick="issueW()">${t('wissueb')}</button></div></div>`;
  h+=`<h3>${t('wstand')}</h3><div class="tw"><table><thead><tr><th>${t('trname')}</th><th>${t('trid')}</th><th>${t('company')}</th><th>${t('wcur')}</th><th>${t('wactive')}</th><th>${t('wcons')}</th></tr></thead><tbody>${warnData.drivers.map(d=>`<tr><td>${esc(d.DriverName)}</td><td>${esc(d.DriverID)}</td><td>${esc(d.Company)}</td><td>${lvl(d.Level)}</td><td>${d.Active}</td><td>${esc(t('wc'+d.Level))}${d.Retrain?` <span class="pill warn">${t('wretrain')}</span>`:''}</td></tr>`).join('')||`<tr><td colspan="6">${t('none')}</td></tr>`}</tbody></table></div>
  <h3>${t('wlog')}</h3><div class="tw"><table><thead><tr><th>${t('date')}</th><th>${t('trname')}</th><th>${t('company')}</th><th>${t('plate')}</th><th>${t('wviol')}</th><th>${t('wlevel')}</th><th>${t('wdetails')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${warnData.warnings.map(w=>`<tr><td>${esc((w.Time||'').slice(0,10))}</td><td>${esc(w.DriverName)}</td><td>${esc(w.Company)}</td><td>${esc(w.Plate)}</td><td>${esc(V[w.Violation]||w.Violation)}</td><td>${lvl(Number(w.Level))}</td><td>${esc(w.Details)}</td><td>${w.Status==='Active'?t('wactive1'):t('wwith')+(w.WithdrawnReason?': '+esc(w.WithdrawnReason):'')}</td><td>${hs&&w.Status==='Active'?`<button class="btn sec sm" onclick="withdrawW('${esc(w.WarnID)}')">${t('wwithb')}</button>`:''}</td></tr>`).join('')||`<tr><td colspan="9">${t('none')}</td></tr>`}</tbody></table></div>`;

// ---------- real PDF download (html2canvas + jsPDF loaded on first use; pages break between rows, never through one) ----------
function loadJs(u){return new Promise((ok,no)=>{const x=document.createElement('script');x.src=u;x.onload=ok;x.onerror=()=>no(new Error('Could not load the PDF tool. Check the internet connection, or use Print and choose Save as PDF.'));document.head.appendChild(x);});}
async function loadPdfLib(){const L=window.PDFLIBS||['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];if(!window.html2canvas)await loadJs(L[0]);if(!(window.jspdf&&window.jspdf.jsPDF))await loadJs(L[1]);}
async function pdfDownload(html,name){const fr=document.createElement('iframe');
  try{note='';await loadPdfLib();
    fr.style.cssText='position:fixed;left:-2000px;top:0;width:794px;height:1123px;border:0';document.body.appendChild(fr);
    const d=fr.contentDocument;d.open();d.write(html);d.close();
    await new Promise(r=>{if(d.readyState==='complete')r();else fr.onload=r;setTimeout(r,1500);});
    try{await d.fonts.ready;}catch(_){}
    const bd=d.body,W=bd.scrollWidth,H=bd.scrollHeight,SC=2,top0=bd.getBoundingClientRect().top;
    const cv=await html2canvas(bd,{scale:SC,useCORS:true,backgroundColor:'#ffffff',windowWidth:794,width:W,height:H,x:0,y:0,scrollX:0,scrollY:0});
    const pw=190,ph=277,pxPage=Math.floor(ph/pw*W);
    const cand=[];d.querySelectorAll('tbody tr:not(:first-child),h1,h2,h3,.nobreak').forEach(e=>{const y=Math.round(e.getBoundingClientRect().top-top0);if(y>0)cand.push(y);});cand.sort((a,b)=>a-b);
    const cuts=[0];let y0=0;while(H-y0>pxPage){const lim=y0+pxPage;let c=0;for(const v of cand){if(v<=lim&&v>y0+pxPage*0.35)c=v;}y0=c||lim;cuts.push(y0);}cuts.push(H);
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    for(let n=0;n<cuts.length-1;n++){const a=cuts[n],b2=cuts[n+1],hh=b2-a;const pc=document.createElement('canvas');pc.width=cv.width;pc.height=Math.max(1,Math.round(hh*SC));const g=pc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,pc.width,pc.height);g.drawImage(cv,0,Math.round(a*SC),cv.width,pc.height,0,0,pc.width,pc.height);
      if(n)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',0.95),'JPEG',10,10,pw,hh/W*pw);}
    pdf.save(name);
  }catch(e){note='!'+e.message;render();}finally{fr.remove();}}

async function readFile(f){
  const b64=x=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(x);});
  if(f.type==='application/pdf'){if(f.size>3.5*1048576)throw new Error(t('toobig'));return{mime:f.type,b64:await b64(f)};}
  if(!/^image\/(jpeg|png)$/.test(f.type))throw new Error(t('badtype'));
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f);});
  const sc=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return{mime:'image/jpeg',b64:c.toDataURL('image/jpeg',.8).split(',')[1]};}

    const col={FIT:'#2e7d32',SUSPENDED:'#e08a00',VOID:'#DD1D21','NOT APPROVED':'#6b7b8c'}[v.Fit]||'#6b7b8c',txt={FIT:t('vfit'),SUSPENDED:t('vsusp'),VOID:t('vvoid'),'NOT APPROVED':t('vna')}[v.Fit];
    box.innerHTML=`<div class="banner" style="background:${col}"><b>${txt}</b></div>
    <div class="card"><table><tbody><tr><td>${t('plate')}</td><td><b>${esc(v.PlateSerial)}</b></td></tr><tr><td>${t('type')}</td><td>${esc(v.Type)}${v.MakeModel?' | '+esc(v.MakeModel):''}</td></tr><tr><td>${t('company')}</td><td>${esc(v.Company)}</td></tr><tr><td>${t('id')}</td><td>${esc(v.ID)}</td></tr><tr><td>${t('stickerno')}</td><td>${esc(v.StickerNo)}</td></tr><tr><td>${t('issued')}</td><td>${esc(v.IssuedAt)}</td></tr><tr><td>${t('nextinsp')}</td><td>${esc(v.NextInspection)}</td></tr></tbody></table>
    ${v.Why&&v.Why.length&&v.Fit!=='FIT'?`<div class="msg err" style="margin-top:12px"><b>${t('reason')}:</b><br>${v.Why.map(esc).join('<br>')}</div>`:''}</div>
    <div class="card"><h3 style="margin-top:0">${t('docs')}</h3><table><tbody>${v.Docs.map(d=>`<tr><td>${t('d_'+d.k)}</td><td>${rpill(d.s)}</td><td style="text-align:right">${d.exp?dpill(d.exp):'-'}${d.pending?`<br><span class="hint">${t('renewpend')}</span>`:''}</td></tr>`).join('')}</tbody></table><div class="hint" style="margin-top:8px">${t('livecheck')}: ${esc((v.AsOf||'').replace('T',' ').slice(0,16))} UTC</div></div>`;
  }catch(e){box.innerHTML=`<div class="banner" style="background:#DD1D21"><b>${esc(e.message)}</b></div>`;}}

(async function init(){applyLang();if(VERIFY)return render();if(token)await load();else render();})();
</script>
</body>
